#################################
#       Compositor Minimal      #
#################################

# Backend GLX recomendado para NVIDIA
backend = "glx";
vsync = true;

# Detectar ventanas con transparencia y bordes redondeados
detect-client-opacity = true;
detect-rounded-corners = true;

# Blur básico
blur = {
  method = "dual_kawase";
  strength = 10;
};
blur-background = true;
blur-background-frame = true;

#################################
#             Rules             #
#################################
rules = (
  # Ventanas normales
  {
    match = "window_type = 'normal'";
    shadow = true;
    opacity = 1.0;
    blur-background = true;
    corner-radius = 8;
  },

  # Diálogos
  {
    match = "window_type = 'dialog'";
    shadow = true;
    opacity = 1.0;
    blur-background = true;
    corner-radius = 8;
  },

  # Tooltips
  {
    match = "window_type = 'tooltip'";
    shadow = false;
    opacity = 0.90;
    corner-radius = 0;
    blur-background = false;
  },

  # Dock / panel
  {
    match = "window_type = 'dock'";
    shadow = false;
    opacity = 1.0;
    corner-radius = 0;
    blur-background = false;
  },

  # Menús flotantes (Rofi, dropdown, popup)
  {
    match = "window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'popup' || window_type = 'popup_menu'";
    shadow = false;
    opacity = 1.0;
    corner-radius = 0;
    blur-background = false;
  },

  # Terminales específicas (Alacritty, Kitty)
  {
    match = "class_g = 'Alacritty' || class_g = 'kitty'";
    shadow = true;
    opacity = 1.0;
    blur-background = false;
    corner-radius = 8;
  }
);
